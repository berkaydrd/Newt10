name: flutter_application_newtten
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.9
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_analytics: ^12.4.1

  fl_chart: ^1.2.0
  image_picker: ^1.2.2
  firebase_storage: ^13.4.1
  cached_network_image: ^3.4.1

  http: ^1.1.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.0
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appICON.png"
  min_sdk_android: 21
